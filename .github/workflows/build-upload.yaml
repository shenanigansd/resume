name: Build and upload resume

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "noxfile.py"
      - ".github/workflows/build-upload.yaml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Typst
        uses: typst-community/setup-typst@fee4b65b091cc546f02ce3be15fad8760f38a108 # v5.3.0

      - name: Install nox
        run: python -m pip install nox

      - name: Build PDFs
        run: nox --sessions build_pdfs

      - name: Login to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906  # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Upload to blob storage
        uses: azure/cli@9eb25b8360668fb0ecbafa808d40e2197b2f5f52  # v3.0.0
        with:
          inlineScript: az storage blob upload-batch --account-name bradleyreynolds --destination '$web' --source build --pattern "*.pdf" --overwrite

      - name: Logout of Azure
        run: az logout
        if: always()
